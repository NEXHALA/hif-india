<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Title, description, canonical, hreflang, and OpenGraph/Twitter tags are
      intentionally NOT hardcoded here — every route renders a <Seo>
      component (see src/components/common/Seo.tsx) that sets unique,
      per-page metadata via react-helmet-async. react-helmet-async does not
      remove pre-existing static tags on mount, so keeping duplicate static
      tags here would produce duplicate <title>/meta/og: tags in the final
      DOM. The `npm run build` pipeline prerenders every known route into
      static HTML with the correct tags already baked in (see
      scripts/prerender.ts), so this bare shell is only ever served, briefly
      pre-hydration, to genuinely unmatched routes or non-JS clients.
    -->
    <!--
      Search engine ownership verification: after creating properties in
      Google Search Console (https://search.google.com/search-console) and
      Bing Webmaster Tools (https://www.bing.com/webmasters), each will give
      you a meta tag to paste here, e.g.:
        <meta name="google-site-verification" content="..." />
        <meta name="msvalidate.01" content="..." />
      Once verified, submit https://hif-india.web.app/sitemap.xml in both
      tools so every page (in all 3 languages) gets crawled and indexed.
    -->

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/images/projects/hif-icon.png" />
    <link rel="apple-touch-icon" href="/images/projects/hif-icon.png" />

    <!-- Google Fonts: Fraunces (editorial serif headlines) + Inter (clean sans body/UI) -->
    <script>
      (function () {
        try {
          var path = location.pathname || '/';
          var lang = 'en';
          if (path === '/kn' || path.indexOf('/kn/') === 0) lang = 'kn';
          else if (path === '/hi' || path.indexOf('/hi/') === 0) lang = 'hi';
          else {
            lang = localStorage.getItem('hif_language');
            if (lang !== 'en' && lang !== 'kn' && lang !== 'hi') lang = 'en';
          }
          document.documentElement.lang = lang;
          document.documentElement.classList.add('lang-' + lang);

          var theme = localStorage.getItem('hif_theme');
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#fefdfb] text-stone-800 antialiased selection:bg-emerald-200 selection:text-emerald-950">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
